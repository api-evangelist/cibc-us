    note: CIBC Bank USA Insured Depository Institution resolution plan (charter/ownership).
actions:
  apisHarvested: 0
  openapiHarvested: false
  reason: |
    No public API surface exists for CIBC Bank USA. Record kept as an honest
    identity-only (built-stub) profile with aggregator-only data-access posture.
